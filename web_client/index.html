<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COBBLEVERSE Wiki Chatbot</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: #16213e;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid #e94560;
      flex-shrink: 0;
    }

    header h1 { font-size: 1.3rem; color: #e94560; letter-spacing: 1px; }
    header span { font-size: 0.85rem; color: #aaa; }

    .llm-badge {
      margin-left: auto;
      font-size: 0.75rem;
      background: #0f3460;
      color: #7eb8f7;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid #7eb8f744;
    }

    #chat-container {
      flex: 1;
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 14px;
      overflow-y: auto;
    }

    .message {
      max-width: 88%;
      padding: 13px 17px;
      border-radius: 14px;
      line-height: 1.65;
      font-size: 0.95rem;
    }

    .message.user {
      align-self: flex-end;
      background: #e94560;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #16213e;
      border: 1px solid #0f3460;
      border-bottom-left-radius: 4px;
    }

    .message.bot strong { color: #e94560; }
    .message.bot em { color: #aaa; font-size: 0.85rem; }
    .message.bot hr { border-color: #0f3460; margin: 10px 0; }
    .message.bot p { margin-bottom: 8px; }
    .message.bot ul, .message.bot ol { padding-left: 20px; margin-bottom: 8px; }
    .message.bot a { color: #7eb8f7; }
    .message.bot code {
      background: #0f3460;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.88rem;
    }

    .message.typing { color: #aaa; font-style: italic; }

    /* streaming cursor */
    .cursor::after {
      content: "▋";
      animation: blink 0.7s step-end infinite;
      color: #e94560;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .meta {
      font-size: 0.72rem;
      color: #555;
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meta .tag {
      background: #0f3460;
      color: #7eb8f7;
      padding: 2px 8px;
      border-radius: 10px;
    }

    #input-area {
      width: 100%;
      max-width: 820px;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      background: #16213e;
      border-top: 1px solid #0f3460;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      height: 46px;
    }

    #user-input:focus { border-color: #e94560; }

    #send-btn {
      padding: 12px 22px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #send-btn:hover { background: #c73652; }
    #send-btn:disabled { background: #444; cursor: not-allowed; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #e9456044;
      border-radius: 16px;
      padding: 5px 13px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover { background: #e94560; color: #fff; border-color: #e94560; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>⚡ COBBLEVERSE Wiki Bot</h1>
    <span>Ask anything about COBBLEVERSE in plain English</span>
  </div>
  <span class="llm-badge">🤖 llama3.2</span>
</header>

<div id="chat-container"></div>

<div id="input-area">
  <input id="user-input" type="text"
    placeholder="e.g. I want to play with friends, how do I set up a server?" />
  <button id="send-btn">Send</button>
</div>

<script>
  const API = "http://localhost:8000";
  const chat = document.getElementById("chat-container");
  const input = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");

  const SUGGESTIONS = [
    "I want to play with my friends, how do I do that?",
    "How do I install COBBLEVERSE?",
    "What is LumyMon?",
    "How do I get COBBLEVERSE on CurseForge?",
    "How do I update my server?",
    "How much RAM do I need?",
  ];

  // ── DOM helpers ─────────────────────────────────────────────────────────────

  function addUserMessage(text) {
    const div = document.createElement("div");
    div.className = "message user";
    div.textContent = text;
    chat.appendChild(div);
    scrollBottom();
  }

  function addBotMessage(markdown, matchedEntries = []) {
    const div = document.createElement("div");
    div.className = "message bot";
    div.innerHTML = marked.parse(markdown);
    if (matchedEntries.length) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = "Sources: " + matchedEntries
        .map(t => `<span class="tag">${t}</span>`).join("");
      div.appendChild(meta);
    }
    chat.appendChild(div);
    scrollBottom();
    return div;
  }

  function addStreamingBotMessage() {
    const div = document.createElement("div");
    div.className = "message bot cursor";
    div.dataset.raw = "";
    chat.appendChild(div);
    scrollBottom();
    return div;
  }

  function appendToStreamingMessage(div, chunk) {
    div.dataset.raw += chunk;
    div.innerHTML = marked.parse(div.dataset.raw);
    scrollBottom();
  }

  function finaliseStreamingMessage(div, matchedEntries = []) {
    div.classList.remove("cursor");
    if (matchedEntries.length) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = "Sources: " + matchedEntries
        .map(t => `<span class="tag">${t}</span>`).join("");
      div.appendChild(meta);
    }
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "message bot typing";
    div.id = "typing";
    div.textContent = "Thinking…";
    chat.appendChild(div);
    scrollBottom();
  }

  function removeTyping() {
    document.getElementById("typing")?.remove();
  }

  function addSuggestions(chips) {
    const wrap = document.createElement("div");
    wrap.className = "message bot";
    wrap.innerHTML = "<em>Try asking:</em>";
    const row = document.createElement("div");
    row.className = "suggestions";
    chips.forEach(c => {
      const btn = document.createElement("span");
      btn.className = "chip";
      btn.textContent = c;
      btn.onclick = () => { input.value = c; sendMessage(); };
      row.appendChild(btn);
    });
    wrap.appendChild(row);
    chat.appendChild(wrap);
    scrollBottom();
  }

  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  // ── send message ─────────────────────────────────────────────────────────────

  async function sendMessage() {
    const query = input.value.trim();
    if (!query || sendBtn.disabled) return;

    input.value = "";
    sendBtn.disabled = true;
    addUserMessage(query);

    // Phase 1: show "Thinking…" while LLM routes the query
    addTyping();

    let matchedEntries = [];

    try {
      // Use the streaming endpoint
      const res = await fetch(`${API}/chat/stream`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });

      removeTyping();

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const streamDiv = addStreamingBotMessage();
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const payload = line.slice(6);
          if (payload === "[DONE]") break;
          try {
            const chunk = JSON.parse(payload);
            appendToStreamingMessage(streamDiv, chunk);
          } catch {}
        }
      }

      finaliseStreamingMessage(streamDiv, matchedEntries);

    } catch (err) {
      removeTyping();
      addBotMessage(
        "⚠️ Could not reach the server. Make sure `python mcp_server/http_server.py` is running and Ollama is active."
      );
    }

    sendBtn.disabled = false;
    input.focus();
  }

  // ── event listeners ──────────────────────────────────────────────────────────

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

  // ── welcome ──────────────────────────────────────────────────────────────────

  addBotMessage(
    "👋 Welcome to the **COBBLEVERSE Wiki Bot**!\n\n" +
    "I'm powered by **llama3.2** and can understand natural language questions about COBBLEVERSE. " +
    "Just ask me anything — no need to use specific keywords."
  );
  addSuggestions(SUGGESTIONS);
</script>
</body>
</html>
