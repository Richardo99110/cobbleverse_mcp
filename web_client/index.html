<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COBBLEVERSE Wiki Chatbot</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: #16213e;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid #e94560;
    }

    header h1 {
      font-size: 1.3rem;
      color: #e94560;
      letter-spacing: 1px;
    }

    header span {
      font-size: 0.85rem;
      color: #aaa;
    }

    #chat-container {
      flex: 1;
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      overflow-y: auto;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .message.user {
      align-self: flex-end;
      background: #e94560;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #16213e;
      border: 1px solid #0f3460;
      border-bottom-left-radius: 4px;
    }

    .message.bot strong { color: #e94560; }
    .message.bot em { color: #aaa; font-size: 0.85rem; }
    .message.bot hr { border-color: #0f3460; margin: 10px 0; }
    .message.bot p { margin-bottom: 8px; }
    .message.bot ul, .message.bot ol { padding-left: 20px; margin-bottom: 8px; }

    .message.typing {
      color: #aaa;
      font-style: italic;
    }

    #input-area {
      width: 100%;
      max-width: 800px;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      background: #16213e;
      border-top: 1px solid #0f3460;
    }

    #user-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
    }

    #user-input:focus { border-color: #e94560; }

    #send-btn {
      padding: 12px 20px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    #send-btn:hover { background: #c73652; }
    #send-btn:disabled { background: #555; cursor: not-allowed; }

    .section-badge {
      display: inline-block;
      font-size: 0.7rem;
      background: #0f3460;
      color: #aaa;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .suggestion-chip {
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #e94560;
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .suggestion-chip:hover { background: #e94560; color: #fff; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>⚡ COBBLEVERSE Wiki Bot</h1>
    <span>Ask me anything about COBBLEVERSE — Installation, Gameplay, Gyms & more</span>
  </div>
</header>

<div id="chat-container"></div>

<div id="input-area">
  <input id="user-input" type="text" placeholder="Ask a question, e.g. How do I install COBBLEVERSE from Modrinth?" />
  <button id="send-btn">Send</button>
</div>

<script>
  const API = "http://localhost:8000";
  const chat = document.getElementById("chat-container");
  const input = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");

  const SUGGESTIONS = [
    "How do I install COBBLEVERSE from Modrinth?",
    "How do I install from CurseForge?",
    "How do I set up an Apex Hosting server?",
    "How do I set up a Nitrado server?",
    "How do I update my Apex server?",
    "What is LumyMon?",
  ];

  function addMessage(text, role, section) {
    const div = document.createElement("div");
    div.className = `message ${role}`;
    if (role === "bot" && section) {
      div.innerHTML = `<span class="section-badge">${section}</span><br>` + marked.parse(text);
    } else if (role === "bot") {
      div.innerHTML = marked.parse(text);
    } else {
      div.textContent = text;
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "message bot typing";
    div.id = "typing-indicator";
    div.textContent = "Searching the wiki…";
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  function addSuggestions(chips) {
    const div = document.createElement("div");
    div.className = "message bot";
    div.innerHTML = "<em>Try asking:</em><div class='suggestions'>" +
      chips.map(c => `<span class="suggestion-chip" onclick="askSuggestion('${c.replace(/'/g, "\\'")}')">${c}</span>`).join("") +
      "</div>";
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function askSuggestion(text) {
    input.value = text;
    sendMessage();
  }

  async function sendMessage() {
    const query = input.value.trim();
    if (!query) return;

    input.value = "";
    sendBtn.disabled = true;
    addMessage(query, "user");
    addTyping();

    try {
      const res = await fetch(`${API}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });
      const data = await res.json();
      removeTyping();
      addMessage(data.answer, "bot", data.section);
    } catch (err) {
      removeTyping();
      addMessage("⚠️ Could not reach the server. Make sure `python mcp_server/http_server.py` is running.", "bot");
    }

    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

  // Welcome message + suggestions
  addMessage(
    "👋 Welcome to the **COBBLEVERSE Wiki Bot**!\n\nI can answer questions about **Installation**, and more sections coming soon. What would you like to know?",
    "bot"
  );
  addSuggestions(SUGGESTIONS);
</script>
</body>
</html>
